[package]
name = "wal_line"
version = "0.1.0"
edition = "2021"
description = "Go/no-go test: WanganArcadeLoader as a Rust plugin for the LINE ELF loader on Windows"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[features]
# Diagnostic build: call back into game code with a deliberately misaligned stack.
misalign-test = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
cc = "1.0"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
panic = "abort"
strip = true
codegen-units = 1
