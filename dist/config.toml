fullscreen = false
input_emu = true
card_emu = true
block_sudo = true
ignore_custom_ioctls = true
dongle = "285013501138"
# 1% deadzone
deadzone = 0.01

# Wait for the display's refresh before swapping frames. Turn this off when
# the display is virtual -- an RDP session presents at about 30Hz, which halves
# the frame rate in menus as well as in a race -- and let fps_limit pace it.
vsync = true

width = 640
height = 480

# Diagnostics. All off by default; each writes to wal_3dxp.log on Windows and
# the terminal on Linux. The game's own reporting is compiled out of the
# release build it ships as, so these are the only way to see inside it.
#
#   input_log  every controller and input, with the name to use in
#              keyconfig.toml -- this is how you find a wheel's axis numbers
#   cg_log     which shader profile Cg picks for your GPU, and the compiler
#              listing for any shader that fails
#   file_log   every file the game opens (failed opens are logged regardless)
#   gl_debug   ask the driver for a debug context and log what it complains
#              about; use this when something renders wrong but nothing errors
input_log = false
cg_log = false
file_log = false
gl_debug = false

# What to do about the dump's shaders, which ship compiled for NVIDIA only.
# The loader checks, before the game reads them, whether this driver has the
# extensions they ask for; if it doesn't, it keeps the originals as *.orig and
# compiles portable replacements from the .cg sources.
#
#   auto      check the driver and do whichever is right (the default)
#   portable  always compile portable ARB, even on NVIDIA
#   original  force the shipped programs, restoring them from *.orig if an
#             earlier run replaced them -- expect a black world unless your
#             GPU has the NVIDIA extensions they need. auto already does this
#             for you when the driver supports them.
#
# Only set this if your driver reports support it doesn't honour.
shader_mode = "auto"

# Map a path the game asks for onto a real file. Needed on Windows when the
# game uses an absolute Linux path: LINE passes those through unchanged and
# confines the game to its own folder, so they fail. Keep entries at the end --
# in TOML everything after a [[table]] header belongs to that table.
# [[file_redirect]]
# from = "/some/path"
# to = "data/replacement"
