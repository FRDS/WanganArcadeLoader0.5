# WanganArcadeLoader. Every key is optional; leave one out and the value here
# is what you get. Longer explanations live in the README.

# Borderless window at your monitor's current resolution, with the game's
# width x height image scaled to fit inside it.
fullscreen = false
# With fullscreen, change the display mode to width x height instead of
# scaling. You only get it exactly if your monitor offers that mode.
fullscreen_exclusive = false

# What the game renders at. Windowed, this has to fit the window's client area
# or the rest is clipped; the loader says so in wal_3dxp.log.
width = 640
height = 480
# Keep the 2D layer undistorted when width:height is not 4:3. Does nothing at
# 4:3. Turn it off to get the old sideways stretch back.
widescreen_hud = true
# Push HUD elements back out to the edges they were drawn against, instead of
# leaving them bunched in the middle 75% of a 16:9 screen. Needs
# widescreen_hud, and does nothing at 4:3. Off by default: it moves things,
# and it has been measured against the in-race HUD rather than every screen.
widescreen_anchor = false

# Unlock the GEMBALLA maker, which the Export build hides, and put the story
# rival who drives the 964 RSR back in it. Applied in memory only -- `main` on
# disk is never touched -- and only if the bytes at every offset are what this
# build should have. The maker half also needs data/car/gem_964_38RS,
# gem_964_RSR and gem_997_AVA to hold their models: an Export dump ships those
# three directories empty, and the loader leaves the maker locked rather than
# offer a car the engine cannot load.
gemballa = false

# Wait for the display's refresh before swapping.
vsync = true
# Frame rate cap, 0 for none. This is the game's speed, not a performance
# setting: the engine takes one simulation step per frame drawn, and 60 is the
# rate the arcade ran at. Raising it makes the game run fast.
fps_limit = 60

# Emulate the JAMMA I/O board, so a keyboard, pad or wheel works. Bindings are
# in keyconfig.toml.
input_emu = true
# Emulate the magnetic card printer against card.bin.
card_emu = true
# Refuse the sudo commands the game runs to set the system clock.
block_sudo = true
# Report success for the two ioctls the game makes on its I/O serial ports,
# which nothing here implements.
ignore_custom_ioctls = true
# Ignore SIGALRM. The game arms a 50 Hz timer for it and never handles it, so
# left alone it ends the game at a random moment with no error and no crash
# dump. Windows only.
ignore_alarm = true
# The dongle id the game checks for.
dongle = "285013501138"
# Stick and pedal deadzone, as a fraction of full travel.
deadzone = 0.01

# What to do about the dump's shaders, which ship compiled for NVIDIA only:
#   auto      convert them only if this driver lacks what they need
#   portable  always convert to ARB, even on NVIDIA
#   original  never convert, and restore *.orig if an earlier run did
shader_mode = "auto"

# Diagnostics, all written to wal_3dxp.log (the terminal on Linux). The game's
# own reporting is compiled out of the build it ships as, so these are the only
# way to see inside it.
#   input_log  every controller and input, with the name for keyconfig.toml
#   cg_log     the shader profile chosen, and the listing for any failure
#   file_log   every file opened; failures are logged either way
#   card_log   every card-printer command; refusals are logged either way
#   car_log    every car the engine resolves, by id and by folder name,
#              with the function that asked for it
#   gl_debug   an OpenGL debug context, relaying the driver's own messages
#   res_log    the screen size, viewports and projections the engine asks for
#              (most of it only at a custom resolution)
input_log = false
cg_log = false
file_log = false
card_log = false
car_log = false
gl_debug = false
res_log = false

# Map a path the game asks for onto a real file, for the absolute Linux paths
# LINE cannot reach. Keep these last: in TOML everything after a [[table]]
# header belongs to that table.
# [[file_redirect]]
# from = "/some/path"
# to = "data/replacement"
