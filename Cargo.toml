[package]
name = "wal_3dxp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
glfw = "0.55"
# 0.36's bundled build looks for the wrong library name when cross-compiling
# for windows-gnu; 0.38 links SDL2 statically on both platforms.
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }
libc = "0.2"
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
local-ip-address = "0.6"
gl = "0.14"

[target.'cfg(unix)'.dependencies]
ctor = "0.2"
region = "3.0"
retour = { git = "https://github.com/BroGamer4256/retour-rs.git" }
glob = "0.3"

[build-dependencies]
cc = "1.0"
gl_generator = "0.14"
khronos_api = "3.1"

[profile.release]
lto = true
panic = 'abort'
strip = true
codegen-units = 1
incremental = true

# Vendored retour fork with one fix: its "win64" function pointer impls no
# longer compile for 32-bit targets on current Rust. See vendor/retour.
[patch."https://github.com/BroGamer4256/retour-rs.git"]
retour = { path = "vendor/retour" }
